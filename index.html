<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>i love u dea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050505;color:#fff;overflow:hidden;
    font-family:"Fira Code",ui-monospace,Menlo,Consolas,monospace}
  ::selection{background:rgba(255,0,60,.3)}
  .scanline{position:fixed;left:0;width:100%;height:100px;pointer-events:none;z-index:1;
    background:linear-gradient(0deg,transparent,rgba(255,255,255,.03),transparent);
    animation:scan 10s linear infinite}
  @keyframes scan{from{top:-100px}to{top:100%}}
  #console,#reveal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    transition:opacity .6s,transform .6s}
  #console{padding:2rem}
  #console .box{width:100%;max-width:42rem;font-size:15px;color:rgba(255,255,255,.8)}
  .row{display:flex;gap:.5rem;min-height:1.6em}
  .soft{color:rgba(255,143,177,.6)}
  .ok{color:#4ade80}
  .hint{color:rgba(255,255,255,.4);font-style:italic}
  #after{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;
    padding-top:2rem;display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem}
  #after.show{opacity:1;transform:none}
  button{font:inherit;cursor:pointer}
  #decrypt{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.5rem;color:#ff8fb1;
    border:1px solid rgba(255,77,109,.3);background:rgba(255,77,109,.05);
    letter-spacing:.2em;text-transform:uppercase;font-size:12px;transition:background .3s}
  #decrypt:hover{background:rgba(255,77,109,.12)}
  .cursor{display:inline-block;width:0;height:1em;border-right:2px solid #ff4d6d;animation:blink 1s step-end infinite}
  @keyframes blink{50%{border-color:transparent}}
  .tiny{font-size:10px;color:rgba(255,255,255,.2);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  #reveal{opacity:0;pointer-events:none;flex-direction:column}
  #reveal.on{opacity:1;pointer-events:auto}
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .title{position:fixed;bottom:2rem;left:0;right:0;z-index:5;text-align:center;opacity:0;transform:scale(.8);
    transition:opacity 1.5s 3s,transform 1.5s 3s}
  #reveal.on .title{opacity:1;transform:none}
  .title h2{margin:0 0 .5rem;color:#ff4d6d;font-weight:400;font-size:20px;letter-spacing:.3em;text-transform:uppercase;
    text-shadow:0 0 10px rgba(255,77,109,.5),0 0 20px rgba(255,77,109,.3)}
  .title .line{width:48px;height:1px;background:rgba(255,77,109,.3);margin:0 auto 2rem}
  #again{background:none;border:0;color:rgba(255,255,255,.25);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  #again:hover{color:rgba(255,255,255,.6)}
  .corner{position:fixed;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.12);pointer-events:none}
  #snd{position:fixed;left:1.2rem;bottom:1.2rem;z-index:20;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,77,109,.35);background:rgba(255,77,109,.08);color:#ff8fb1;font-size:18px;line-height:1;
    display:none;align-items:center;justify-content:center;cursor:pointer}
  #snd.show{display:flex}
  #snd:hover{background:rgba(255,77,109,.18)}
</style>
</head>
<body>
<div class="scanline"></div>

<div id="console">
  <div class="box">
    <div class="row soft"><span>[system]</span><span id="typed"></span></div>
    <div class="row"><span>[status]</span><span id="ready" class="ok"></span></div>
    <div id="after">
      <p class="hint" style="margin:0">&gt; One encrypted package found for you.</p>
      <button id="decrypt" type="button">🔒 <span>Decrypt Message</span><span class="cursor"></span></button>
      <p class="tiny" style="margin:0">(or just click anywhere)</p>
    </div>
  </div>
</div>

<button id="snd" type="button" aria-label="suara">🔊</button>

<div id="reveal">
  <canvas id="c"></canvas>
  <div class="title">
    <button id="again" type="button">Re-encrypt</button>
  </div>
  <div class="corner" style="top:2rem;left:2rem">ln: 420<br>id: 0xDEADBEEF<br>type: organic_emotion</div>
  <div class="corner" style="bottom:2rem;right:2rem">heart_reveal // success</div>
</div>

<script>
(function () {

/* ---------- musik (dibuat langsung di browser, bebas hak cipta) ---------- */
var Music = (function () {
  var ctx = null, master, started = false, muted = false, timer = null, nextT = 0, step = 0;
  var BPM = 66, EIGHTH = 60 / BPM / 2;
  var CH = [ // bass, arpeggio (8 slot), melodi (8 slot, 0 = diam)
    {b:48, a:[60,64,67,72,67,64,67,64], m:[76,0,79,0,84,0,79,76]},
    {b:43, a:[59,62,67,71,67,62,67,62], m:[74,0,79,0,83,0,79,74]},
    {b:45, a:[60,64,69,72,69,64,69,64], m:[72,0,76,0,81,0,76,72]},
    {b:41, a:[60,65,69,72,69,65,69,65], m:[72,0,77,0,81,0,84,0]},
    {b:48, a:[60,64,67,72,67,64,67,64], m:[79,0,76,0,72,0,76,79]},
    {b:43, a:[59,62,67,71,67,62,67,62], m:[83,0,79,0,74,0,79,0]},
    {b:45, a:[60,64,69,72,69,64,69,64], m:[81,0,76,0,72,0,76,0]},
    {b:41, a:[60,65,69,72,69,65,69,65], m:[77,0,81,0,84,0,0,0]}
  ];
  var hz = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };

  function impulse(c) { // pantulan ruang lembut
    var len = c.sampleRate * 3.2, buf = c.createBuffer(2, len, c.sampleRate);
    for (var ch = 0; ch < 2; ch++) { var d = buf.getChannelData(ch);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    return buf;
  }
  function bell(t, m, vol, dur) {
    var f = hz(m), g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(master.dry); g.connect(master.wet);
    [[1, 1], [2, .28], [3, .09], [4.2, .04]].forEach(function (h) {
      var o = ctx.createOscillator(), hg = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f * h[0]; hg.gain.value = h[1];
      o.connect(hg); hg.connect(g); o.start(t); o.stop(t + dur + .05);
    });
  }
  function pad(t, notes, dur) {
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(.05, t + .9); g.gain.linearRampToValueAtTime(.0001, t + dur + .8);
    lp.connect(g); g.connect(master.dry); g.connect(master.wet);
    notes.forEach(function (m) {
      [-6, 6].forEach(function (det) {
        var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(m); o.detune.value = det;
        o.connect(lp); o.start(t); o.stop(t + dur + 1);
      });
    });
  }
  function bass(t, m) {
    var o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + EIGHTH * 7);
    o.connect(g); g.connect(master.dry); o.start(t); o.stop(t + EIGHTH * 7 + .1);
  }
  function schedule() {
    while (nextT < ctx.currentTime + 0.4) {
      var bar = Math.floor(step / 8) % CH.length, slot = step % 8, c = CH[bar];
      if (slot === 0) {
        bass(nextT, c.b);
        pad(nextT, [c.a[0], c.a[1], c.a[2]], EIGHTH * 8);
      }
      bell(nextT, c.a[slot], .06, 1.4);
      if (c.m[slot]) bell(nextT + 0.005, c.m[slot], .13, 2.4);
      nextT += EIGHTH; step++;
    }
  }
  function init() {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    var out = ctx.createGain(); out.gain.value = 0.0001; out.connect(ctx.destination);
    var comp = ctx.createDynamicsCompressor(); comp.connect(out);
    var dry = ctx.createGain(); dry.gain.value = .8; dry.connect(comp);
    var wet = ctx.createGain(); wet.gain.value = .55;
    var rev = ctx.createConvolver(); rev.buffer = impulse(ctx); wet.connect(rev); rev.connect(comp);
    master = { out: out, dry: dry, wet: wet };
    return true;
  }
  return {
    start: function () {
      if (started) { if (ctx && ctx.state === 'suspended') ctx.resume(); return; }
      if (!init()) return;
      started = true; ctx.resume();
      nextT = ctx.currentTime + 0.15; step = 0; schedule();
      timer = setInterval(schedule, 120);
      master.out.gain.setValueAtTime(0.0001, ctx.currentTime);
      master.out.gain.exponentialRampToValueAtTime(.9, ctx.currentTime + 3);   // fade-in pelan
    },
    toggle: function () {
      if (!started) return muted;
      muted = !muted; var t = ctx.currentTime;
      master.out.gain.cancelScheduledValues(t); master.out.gain.setValueAtTime(Math.max(master.out.gain.value, .0001), t);
      master.out.gain.exponentialRampToValueAtTime(muted ? .0001 : .9, t + .35);
      return muted;
    },
    pause: function () { if (ctx && ctx.state === 'running') ctx.suspend(); },
    resume: function () { if (ctx && started && ctx.state === 'suspended') ctx.resume(); },
    level: function () { // untuk pengujian
      if (!ctx) return -1; return ctx.currentTime;
    }
  };
})();
window.__music = Music;
document.addEventListener('visibilitychange', function () { document.hidden ? Music.pause() : Music.resume(); });
var sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', function (e) { e.stopPropagation(); sndBtn.textContent = Music.toggle() ? '🔇' : '🔊'; });

  var consoleEl = document.getElementById('console');
  var revealEl = document.getElementById('reveal');
  var typed = document.getElementById('typed');
  var ready = document.getElementById('ready');
  var after = document.getElementById('after');
  var finished = false;
  var stage = 'console';
  var msg = ' Initializing heart.PROTOCOL_v2.0...';
  var i = 0;

  (function type() {
    if (i < msg.length) { typed.textContent += msg[i++]; setTimeout(type, 30); }
    else { finished = true; ready.textContent = 'READY'; after.classList.add('show'); document.body.style.cursor = 'pointer'; }
  })();

  function showReveal() {
    if (stage !== 'console' || !finished) return;
    stage = 'reveal';
    Music.start(); sndBtn.classList.add('show');
    consoleEl.style.opacity = 0; consoleEl.style.transform = 'scale(1.05)'; consoleEl.style.pointerEvents = 'none';
    revealEl.classList.add('on');
    startHeart();
  }
  function showConsole() {
    stage = 'console';
    revealEl.classList.remove('on');
    stopHeart();
    consoleEl.style.opacity = 1; consoleEl.style.transform = 'none'; consoleEl.style.pointerEvents = 'auto';
  }
  document.body.addEventListener('click', showReveal);
  document.getElementById('decrypt').addEventListener('click', function (e) { e.stopPropagation(); showReveal(); });
  document.getElementById('again').addEventListener('click', function (e) { e.stopPropagation(); showConsole(); });

  /* ---------- hati dari tulisan ---------- */
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var points = [], raf = 0, startTime = null, TEXT = 'i love u dea';

  function heartXY(t) {
    return [16 * Math.pow(Math.sin(t), 3),
      -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
  }
  function init() {
    var dpr = window.devicePixelRatio || 1, w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    points = [];
    var cx = w / 2, cy = h / 2, scale = Math.min(w, h) / 40, t, s, p;
    for (t = 0; t < Math.PI * 2; t += 0.05) {
      p = heartXY(t);
      points.push({ x: cx + p[0] * scale, y: cy + p[1] * scale, a: 0, ta: .8 + Math.random() * .2, d: Math.random() * 2000 });
    }
    for (s = .2; s < 1; s += .2) {
      for (t = 0; t < Math.PI * 2; t += 0.1) {
        p = heartXY(t);
        points.push({ x: cx + p[0] * scale * s, y: cy + p[1] * scale * s, a: 0, ta: .4 + Math.random() * .4, d: Math.random() * 3000 });
      }
    }
  }
  function draw(time) {
    if (startTime === null) startTime = time;
    var el = time - startTime, w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.font = '13px "Fira Code", monospace';
    var tw = ctx.measureText(TEXT).width;
    for (var k = 0; k < points.length; k++) {
      var p = points[k];
      if (el > p.d) p.a += (p.ta - p.a) * .02;
      ctx.fillStyle = 'rgba(255,77,109,' + p.a + ')';
      ctx.fillText(TEXT, p.x - tw / 2, p.y);
    }
    raf = requestAnimationFrame(draw);
  }
  function startHeart() { startTime = null; init(); cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  function stopHeart() { cancelAnimationFrame(raf); }
  window.addEventListener('resize', function () { if (stage === 'reveal') init(); });
})();
</script>
</body>
</html>
